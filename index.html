<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#050b14">
<title>CHAT X — Official APK Download</title>

<style>
*{box-sizing:border-box}

body{
 margin:0;
 min-height:100vh;
 padding:25px 15px;
 display:flex;
 align-items:center;
 justify-content:center;
 background:radial-gradient(ellipse at top,#12334b,#050b14 65%);
 color:#fff;
 font-family:Arial,sans-serif
}

.container{
 width:100%;
 max-width:440px;
 text-align:center
}

.logo{
 width:110px;
 height:110px;
 object-fit:cover;
 border-radius:25px;
 border:2px solid #22dfff;
 box-shadow:0 0 30px #00cfff35
}

h1{
 font-size:35px;
 letter-spacing:3px;
 margin:20px 0 8px
}

.subtitle{
 color:#a8bdcf;
 line-height:1.7;
 font-size:14px
}

.card{
 margin-top:25px;
 padding:23px;
 background:#101b2a;
 border:1px solid #29445b;
 border-radius:22px;
 box-shadow:0 15px 40px #0005
}

.stats{
 display:grid;
 grid-template-columns:1fr 1fr;
 gap:12px
}

.stat{
 background:#07111c;
 padding:18px 8px;
 border:1px solid #263d52;
 border-radius:14px
}

.number{
 font-size:26px;
 font-weight:bold;
 color:#22dfff;
 overflow-wrap:anywhere
}

.label{
 margin-top:8px;
 color:#a8bdcf;
 font-size:11px;
 letter-spacing:1px
}

.download{
 display:block;
 margin-top:22px;
 padding:17px 10px;
 background:linear-gradient(100deg,#22dfff,#168cff);
 color:#00111b;
 font-weight:900;
 text-decoration:none;
 border-radius:13px;
 letter-spacing:1px
}

.download:active{
 transform:scale(.98)
}

.version{
 margin-top:18px;
 color:#22dfff;
 font-size:14px
}

.status{
 font-size:12px;
 color:#a8bdcf;
 line-height:1.7;
 overflow-wrap:anywhere;
 margin-top:12px
}

.footer{
 color:#8298ad;
 font-size:11px;
 margin-top:22px;
 line-height:1.8
}

.footer a{
 color:#22dfff;
 text-decoration:none
}
</style>
</head>

<body>
<main class="container">

<!-- LOGO: Upload chatx-logo.jpg to this repository -->
<img
 class="logo"
 src="./chatx-logo.jpg"
 alt="CHAT X Logo"
 onerror="this.style.display='none'"
>

<h1>CHAT X</h1>

<div class="subtitle">
CONNECT · CHAT · SHARE<br>
Official APK Download<br>
NIKHIL 009 MOD HUB
</div>

<section class="card">

<div class="stats">

 <div class="stat">
  <div class="number" id="downloads">—</div>
  <div class="label">APK DOWNLOADS</div>
 </div>

 <div class="stat">
  <div class="number" id="version">—</div>
  <div class="label">LATEST VERSION</div>
 </div>

</div>

<a class="download" id="downloadButton"
 href="https://github.com/Nikhil-009-modeller/CHATX-APK-DOWNLOAD.NET/releases"
 target="_blank" rel="noopener">
 DOWNLOAD APK
</a>

<div class="version" id="releaseName">
Loading latest release...
</div>

<div class="status" id="status">
Connecting to GitHub...
</div>

</section>

<div class="footer">
© 2026 NIKHIL 009 MOD HUB<br>
CHAT X — CONNECT · CHAT · SHARE<br>
<a href="https://youtube.com/@nikhil009-mod-hubofficial">
YouTube
</a>
</div>

</main>

<script>
const OWNER = "Nikhil-009-modeller";
const REPO = "CHATX-APK-DOWNLOAD.NET";

const $ = id => document.getElementById(id);

async function loadRelease(){

 try{

  const response = await fetch(
   `https://api.github.com/repos/${OWNER}/${REPO}/releases/latest`,
   {headers:{"Accept":"application/vnd.github+json"}}
  );

  if(!response.ok){
   throw new Error(
    "No published release found. Upload your APK in GitHub Releases."
   );
  }

  const release = await response.json();

  const apks = (release.assets || []).filter(
   asset => asset.name.toLowerCase().endsWith(".apk")
  );

  const totalDownloads = apks.reduce(
   (sum, asset) => sum + Number(asset.download_count || 0),
   0
  );

  $("downloads").textContent =
   totalDownloads.toLocaleString();

  $("version").textContent =
   release.tag_name || "Latest";

  $("releaseName").textContent =
   release.name || "Official CHAT X Release";

  const button = $("downloadButton");

  if(apks.length){

   const apk = apks[0];

   button.href = apk.browser_download_url;

   $("status").textContent =
    apk.name + " · " +
    (apk.size / 1024 / 1024).toFixed(1) +
    " MB · Ready to download";

  }else{

   button.href = release.html_url;

   $("status").textContent =
    "APK file not attached. Open the release to download.";
  }

 }catch(error){

  $("downloads").textContent = "—";
  $("version").textContent = "—";

  $("releaseName").textContent =
   "APK release not available yet";

  $("status").textContent = error.message;

 }

}

loadRelease();
</script>

</body>
</html>
